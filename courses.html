<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الكورسات الدراسية</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col">

    <!-- الشريط العلوي -->
    <nav class="bg-slate-900/90 border-b border-slate-800 sticky top-0 z-40 px-6 py-4 backdrop-blur">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <a href="index.html" class="text-xl font-black text-white">
                منصة <span class="text-blue-500">التفوق</span>
            </a>
            <div class="flex items-center gap-3">
                <span id="unlocked-count" class="hidden sm:inline-block text-xs font-bold bg-emerald-500/15 text-emerald-300 border border-emerald-500/30 px-3 py-1.5 rounded-xl"></span>
                <a href="index.html" class="text-sm font-bold text-slate-300 hover:text-white bg-slate-800 hover:bg-slate-700 px-4 py-2 rounded-xl transition">
                    الرئيسية
                </a>
            </div>
        </div>
    </nav>

    <!-- المحتوى الرئيسي -->
    <main class="max-w-7xl mx-auto w-full px-6 py-12 flex-grow">
        <div class="mb-10 flex flex-col md:flex-row md:items-end justify-between gap-4">
            <div>
                <h1 class="text-3xl font-black text-white">الكورسات المتاحة</h1>
                <p class="text-slate-400 text-sm mt-2">
                    أدخل كود التفعيل الخاص بالكورس المطلوب لفتحه مباشرة، بينما تظل باقي الكورسات مقفولة.
                </p>
            </div>
            <button onclick="loadCoursesPage()" class="self-start md:self-auto text-xs font-bold bg-slate-800 hover:bg-slate-700 text-slate-200 px-4 py-2 rounded-xl transition">
                ↻ تحديث القائمة
            </button>
        </div>

        <!-- حالة التحميل -->
        <div id="loading-box" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
            <div class="bg-slate-900 border border-slate-800 rounded-3xl p-6 h-64 animate-pulse"></div>
            <div class="bg-slate-900 border border-slate-800 rounded-3xl p-6 h-64 animate-pulse"></div>
            <div class="bg-slate-900 border border-slate-800 rounded-3xl p-6 h-64 animate-pulse"></div>
        </div>

        <!-- شبكة الكورسات -->
        <div id="courses-grid" class="hidden grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8"></div>

        <!-- رسالة في حال عدم وجود كورسات -->
        <div id="empty-box" class="hidden bg-slate-900 border border-slate-800 rounded-3xl p-10 text-center max-w-lg mx-auto my-10">
            <p class="text-lg font-extrabold text-white mb-2">لا توجد كورسات مضافة حالياً</p>
            <p class="text-slate-400 text-sm">يمكنك إضافة الكورسات والفيديوهات والأكواد من لوحة الأدمن.</p>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js" onerror="console.warn('config.js not found, using fallback config')"></script>
    <script>
        const FALLBACK_URL = "https://ewtshnnehaczenjvbshg.supabase.co";
        const FALLBACK_KEY = "sb_publishable_SUVALSaLiSmWK18S2Wn5zQ_ZSSqfraK";

        if (typeof _supabase === "undefined") {
            const url = typeof SUPABASE_URL !== "undefined" ? SUPABASE_URL : FALLBACK_URL;
            const key = typeof SUPABASE_ANON_KEY !== "undefined" ? SUPABASE_ANON_KEY : FALLBACK_KEY;
            window._supabase = window.supabase.createClient(url, key);
        }

        if (typeof getClientId !== "function") {
            window.getClientId = function () {
                let cid = localStorage.getItem("edtech_client_id");
                if (!cid) {
                    cid = "stu_" + (crypto.randomUUID ? crypto.randomUUID() : Math.random().toString(36).slice(2));
                    localStorage.setItem("edtech_client_id", cid);
                }
                return cid;
            };
        }

        let coursesList = [];
        let unlockedCourseIds = new Set();
        let videoCountsMap = {};

        async function loadCoursesPage() {
            const clientId = getClientId();
            const loadingBox = document.getElementById('loading-box');
            const grid = document.getElementById('courses-grid');
            const emptyBox = document.getElementById('empty-box');

            loadingBox.classList.remove('hidden');
            grid.classList.add('hidden');
            emptyBox.classList.add('hidden');

            try {
                const { data: courses, error: coursesErr } = await _supabase
                    .from('courses')
                    .select('id, title, description')
                    .order('id', { ascending: true });

                if (coursesErr) throw coursesErr;

                const { data: unlocks, error: unlocksErr } = await _supabase
                    .from('student_unlocks')
                    .select('course_id')
                    .eq('client_id', clientId);

                if (unlocksErr) throw unlocksErr;

                const { data: videos, error: vidErr } = await _supabase
                    .from('course_videos')
                    .select('course_id');

                if (vidErr) throw vidErr;

                coursesList = courses || [];
                unlockedCourseIds = new Set((unlocks || []).map(u => Number(u.course_id)));
                videoCountsMap = {};
                (videos || []).forEach(v => {
                    const cid = Number(v.course_id);
                    videoCountsMap[cid] = (videoCountsMap[cid] || 0) + 1;
                });

                loadingBox.classList.add('hidden');

                if (coursesList.length === 0) {
                    emptyBox.classList.remove('hidden');
                    return;
                }

                renderCourses();
                grid.classList.remove('hidden');
            } catch (err) {
                loadingBox.innerHTML = `
                    <div class="col-span-full bg-rose-950/30 border border-rose-500/40 rounded-3xl p-6 text-center">
                        <p class="font-extrabold text-rose-300 mb-1">حدث خطأ أثناء تحميل الكورسات</p>
                        <p class="text-xs text-rose-200/80">${escapeHtml(err.message || 'تأكد من إعدادات الاتصال بقاعدة البيانات')}</p>
                    </div>
                `;
            }
        }

        function renderCourses() {
            const grid = document.getElementById('courses-grid');
            const countBadge = document.getElementById('unlocked-count');

            countBadge.textContent = `الكورسات المفتوحة: ${unlockedCourseIds.size} من ${coursesList.length}`;
            countBadge.classList.remove('hidden');

            grid.innerHTML = '';

            coursesList.forEach(course => {
                const courseIdNum = Number(course.id);
                const isUnlocked = unlockedCourseIds.has(courseIdNum);
                const vidCount = videoCountsMap[courseIdNum] || 0;

                grid.innerHTML += `
                    <div class="bg-slate-900 border ${isUnlocked ? 'border-emerald-500/40' : 'border-slate-800'} rounded-3xl overflow-hidden flex flex-col justify-between shadow-xl transition">
                        <div>
                            <div class="p-6 bg-gradient-to-br ${isUnlocked ? 'from-emerald-950/70 to-slate-900' : 'from-slate-800/70 to-slate-900'} border-b border-slate-800 flex items-start justify-between gap-3">
                                <h2 class="text-xl font-black text-white leading-snug">${escapeHtml(course.title)}</h2>
                                <span class="shrink-0 text-xs font-extrabold px-3 py-1 rounded-full ${isUnlocked ? 'bg-emerald-500/20 text-emerald-300 border border-emerald-500/30' : 'bg-rose-500/20 text-rose-300 border border-rose-500/30'}">
                                    ${isUnlocked ? 'مفتوح ✅' : 'مقفول 🔒'}
                                </span>
                            </div>

                            <div class="p-6 space-y-3">
                                <p class="text-slate-400 text-sm leading-relaxed">
                                    ${escapeHtml(course.description || 'محتوى تعليمي منظم عبر محاضرات ودروس الكورس.')}
                                </p>
                                <p class="text-xs font-bold text-blue-400">
                                    عدد الفيديوهات: ${vidCount}
                                </p>
                            </div>
                        </div>

                        <div class="px-6 pb-6">
                            ${isUnlocked ? `
                                <a href="watch.html?id=${encodeURIComponent(course.id)}"
                                   class="w-full py-3 rounded-2xl bg-emerald-600 hover:bg-emerald-500 text-white font-extrabold text-sm flex items-center justify-center transition">
                                    دخول ومشاهدة الكورس 🎬
                                </a>
                            ` : `
                                <div class="space-y-2.5">
                                    <input id="code-input-${course.id}" type="text" placeholder="أدخل كود تفعيل هذا الكورس"
                                        onkeydown="if(event.key==='Enter') activateCourseCode(${course.id})"
                                        class="w-full bg-slate-950 border border-slate-700 focus:border-blue-500 rounded-xl px-4 py-2.5 text-sm text-white placeholder-slate-500 outline-none transition">
                                    <button id="btn-activate-${course.id}" onclick="activateCourseCode(${course.id})"
                                        class="w-full py-2.5 rounded-2xl bg-blue-600 hover:bg-blue-500 disabled:opacity-50 text-white font-extrabold text-sm transition">
                                        تفعيل الكورس
                                    </button>
                                    <p id="msg-${course.id}" class="text-xs font-bold min-h-[18px] text-center"></p>
                                </div>
                            `}
                        </div>
                    </div>
                `;
            });
        }

        async function activateCourseCode(courseId) {
            const input = document.getElementById(`code-input-${courseId}`);
            const btn = document.getElementById(`btn-activate-${courseId}`);
            const msg = document.getElementById(`msg-${courseId}`);
            const rawCode = input.value.trim().toUpperCase();

            if (!rawCode) {
                setMessage(msg, "من فضلك أدخل كود التفعيل أولاً", "error");
                return;
            }

            btn.disabled = true;
            setMessage(msg, "جاري التحقق من الكود...", "info");

            try {
                const { data: codeRow, error: codeErr } = await _supabase
                    .from('activation_codes')
                    .select('id, code, course_id, max_uses, used_count')
                    .eq('code', rawCode)
                    .maybeSingle();

                if (codeErr) throw codeErr;

                if (!codeRow) {
                    setMessage(msg, "❌ الكود غير موجود أو غير صحيح", "error");
                    btn.disabled = false;
                    return;
                }

                if (Number(codeRow.course_id) !== Number(courseId)) {
                    setMessage(msg, "⚠️ هذا الكود مخصص لكورس آخر وليس هذا الكورس", "error");
                    btn.disabled = false;
                    return;
                }

                const maxUses = Number(codeRow.max_uses ?? 1);
                const usedCount = Number(codeRow.used_count ?? 0);

                if (maxUses > 0 && usedCount >= maxUses) {
                    setMessage(msg, "❌ تم استهلاك الحد الأقصى لاستخدام هذا الكود", "error");
                    btn.disabled = false;
                    return;
                }

                const clientId = getClientId();
                const { error: unlockErr } = await _supabase
                    .from('student_unlocks')
                    .upsert(
                        [{ client_id: clientId, course_id: Number(courseId) }],
                        { onConflict: 'client_id,course_id', ignoreDuplicates: true }
                    );

                if (unlockErr) throw unlockErr;

                await _supabase
                    .from('activation_codes')
                    .update({ used_count: usedCount + 1 })
                    .eq('id', codeRow.id);

                unlockedCourseIds.add(Number(courseId));
                renderCourses();
            } catch (err) {
                setMessage(msg, "حدث خطأ أثناء التفعيل: " + (err.message || ""), "error");
                btn.disabled = false;
            }
        }

        function setMessage(el, text, type) {
            el.textContent = text;
            if (type === "error") {
                el.className = "text-xs font-bold min-h-[18px] text-center text-rose-400";
            } else if (type === "info") {
                el.className = "text-xs font-bold min-h-[18px] text-center text-sky-400";
            } else {
                el.className = "text-xs font-bold min-h-[18px] text-center text-emerald-400";
            }
        }

        function escapeHtml(str) {
            return String(str || '')
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        loadCoursesPage();
    </script>
</body>
</html>
