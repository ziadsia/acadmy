<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الكورسات الدراسية</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <nav class="navbar">
        <h1>منصتي التعليمية 📚</h1>
        <div class="nav-links">
            <span id="user-email" style="font-size: 0.9rem; color: var(--muted);"></span>
            <button class="btn btn-danger" onclick="logout()">خروج</button>
        </div>
    </nav>

    <div class="container">
        <h2>الكورسات المتاحة</h2>
        <div class="grid" id="courses-grid">جاري تحميل الكورسات...</div>
    </div>

    <script src="config.js"></script>
    <script>
        let currentUser = null;

        async function init() {
            currentUser = await checkAuth();
            if (!currentUser) return;
            document.getElementById('user-email').innerText = currentUser.email;
            loadCourses();
        }

        async function loadCourses() {
            const { data: courses } = await _supabase.from('courses').select('*').order('id');
            const { data: enrolled } = await _supabase
                .from('student_courses')
                .select('course_id')
                .eq('student_email', currentUser.email);

            const unlockedIds = enrolled ? enrolled.map(e => e.course_id) : [];
            const grid = document.getElementById('courses-grid');
            grid.innerHTML = '';

            if (!courses || courses.length === 0) {
                grid.innerHTML = '<p>لا توجد كورسات مضافة حالياً.</p>';
                return;
            }

            courses.forEach(course => {
                const isUnlocked = unlockedIds.includes(course.id);
                grid.innerHTML += `
                    <div class="card">
                        <div class="card-header">
                            <h3>${course.title}</h3>
                        </div>
                        <div class="card-body">
                            <span class="badge ${isUnlocked ? 'badge-open' : 'badge-locked'}">
                                ${isUnlocked ? '✅ مفعل لك' : '🔒 مغلق بكود'}
                            </span>
                            <p style="color: var(--muted); margin: 15px 0;">${course.description || ''}</p>
                            
                            ${isUnlocked ? `
                                <a href="watch.html?course_id=${course.id}" class="btn btn-success" style="width: 100%; text-align: center;">
                                    دخول ومشاهدة المحاضرات 🎬
                                </a>
                            ` : `
                                <input type="text" id="code-${course.id}" placeholder="اكتب كود التفعيل هنا...">
                                <button class="btn btn-primary" style="width: 100%;" onclick="activateCourse(${course.id})">
                                    تفعيل الكورس الآن
                                </button>
                            `}
                        </div>
                    </div>
                `;
            });
        }

        async function activateCourse(courseId) {
            const code = document.getElementById(`code-${courseId}`).value.trim();
            if (!code) return alert("من فضلك اكتب الكود أولاً!");

            const { data: codeData, error } = await _supabase
                .from('activation_codes')
                .select('*')
                .eq('code', code)
                .eq('course_id', courseId)
                .eq('is_used', false)
                .single();

            if (error || !codeData) {
                return alert("❌ الكود غير صحيح، أو تم استخدامه من قبل، أو يخص كورس آخر!");
            }

            await _supabase.from('student_courses').insert([{
                student_email: currentUser.email,
                course_id: courseId
            }]);

            await _supabase.from('activation_codes').update({
                is_used: true,
                used_by: currentUser.email
            }).eq('id', codeData.id);

            alert("🎉 تم تفعيل الكورس بنجاح! استمتع بالمحاضرات.");
            loadCourses();
        }

        init();
    </script>
</body>
</html>
