<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم المنصة</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col">

    <!-- شاشة دخول الأدمن -->
    <div id="login-screen" class="flex-grow flex items-center justify-center p-6">
        <div class="bg-slate-900 border border-slate-800 rounded-3xl p-8 w-full max-w-md shadow-2xl">
            <h1 class="text-2xl font-black text-white mb-2">لوحة التحكم</h1>
            <p class="text-slate-400 text-xs mb-6 leading-relaxed">
                أدخل رمز الدخول الإداري للوصول إلى إدارة الكورسات، البلاي ليست، الفيديوهات، والأكواد.
            </p>
            <input id="admin-pass-input" type="password" placeholder="أدخل رمز الدخول"
                onkeydown="if(event.key==='Enter') unlockAdmin()"
                class="w-full bg-slate-950 border border-slate-700 focus:border-blue-500 rounded-xl px-4 py-3 text-sm text-white outline-none mb-3">
            <button onclick="unlockAdmin()"
                class="w-full py-3 rounded-xl bg-blue-600 hover:bg-blue-500 font-extrabold text-sm text-white transition">
                دخول اللوحة
            </button>
            <p id="login-error" class="text-rose-400 text-xs font-bold mt-3 text-center min-h-[18px]"></p>
        </div>
    </div>

    <!-- اللوحة الرئيسية -->
    <div id="dashboard-screen" class="hidden flex-grow flex flex-col">
        <nav class="bg-slate-900 border-b border-slate-800 sticky top-0 z-40 px-6 py-4">
            <div class="max-w-7xl mx-auto flex flex-wrap justify-between items-center gap-4">
                <div class="flex items-center gap-4">
                    <span class="text-lg font-black text-white">إدارة <span class="text-blue-500">المنصة</span></span>
                    <a href="courses.html" target="_blank" class="text-xs font-bold bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-1.5 rounded-lg transition">
                        معاينة صفحة الكورسات ↗
                    </a>
                </div>
                <button onclick="logoutAdmin()" class="text-xs font-bold bg-rose-500/15 hover:bg-rose-500/25 text-rose-300 border border-rose-500/30 px-3.5 py-2 rounded-xl transition">
                    تسجيل خروج
                </button>
            </div>
        </nav>

        <main class="max-w-7xl mx-auto w-full px-6 py-8 space-y-10 flex-grow">
            <!-- شريط إشعارات -->
            <div id="toast-bar" class="hidden rounded-2xl px-5 py-3.5 text-sm font-bold border"></div>

            <!-- القسم 1: إضافة / تعديل كورس -->
            <section class="bg-slate-900 border border-slate-800 rounded-3xl p-6 space-y-5">
                <div class="flex items-center justify-between">
                    <h2 id="course-form-title" class="text-xl font-black text-white">إضافة كورس جديد</h2>
                    <button id="cancel-edit-btn" onclick="resetCourseForm()" class="hidden text-xs font-bold text-slate-400 hover:text-white underline">
                        إلغاء التعديل
                    </button>
                </div>

                <input type="hidden" id="edit-course-id">
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-300 mb-1.5">اسم الكورس *</label>
                        <input id="course-title-input" type="text" placeholder="مثال: الكورس الثالث - مراجعة"
                            class="w-full bg-slate-950 border border-slate-700 focus:border-blue-500 rounded-xl px-4 py-2.5 text-sm text-white outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-300 mb-1.5">بلاي ليست يوتيوب (رابط أو Playlist ID)</label>
                        <input id="course-playlist-input" type="text" placeholder="اختياري: PLxxxx أو رابط البلاي ليست"
                            class="w-full bg-slate-950 border border-slate-700 focus:border-blue-500 rounded-xl px-4 py-2.5 text-sm text-white outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-300 mb-1.5">وصف مختصر للكورس</label>
                        <input id="course-desc-input" type="text" placeholder="وصف يظهر للطالب في صفحة الكورسات"
                            class="w-full bg-slate-950 border border-slate-700 focus:border-blue-500 rounded-xl px-4 py-2.5 text-sm text-white outline-none">
                    </div>
                </div>

                <button onclick="saveCourse()" id="save-course-btn"
                    class="bg-blue-600 hover:bg-blue-500 text-white font-extrabold text-sm px-6 py-2.5 rounded-xl transition">
                    حفظ الكورس
                </button>

                <!-- جدول الكورسات الحالية -->
                <div class="pt-4 border-t border-slate-800 overflow-x-auto">
                    <table class="w-full text-right text-sm">
                        <thead class="text-xs text-slate-400 border-b border-slate-800">
                            <tr>
                                <th class="py-3 px-3">#</th>
                                <th class="py-3 px-3">الكورس</th>
                                <th class="py-3 px-3">Playlist ID</th>
                                <th class="py-3 px-3">الإجراءات</th>
                            </tr>
                        </thead>
                        <tbody id="courses-table-body" class="divide-y divide-slate-800/70"></tbody>
                    </table>
                </div>
            </section>

            <!-- القسم 2 و 3: إدارة الفيديوهات + إدارة الأكواد -->
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">

                <!-- إدارة الفيديوهات الخاصة بكورس معين -->
                <section class="bg-slate-900 border border-slate-800 rounded-3xl p-6 space-y-5">
                    <h2 class="text-lg font-black text-white">إدارة فيديوهات الكورس (أي مصدر)</h2>

                    <div>
                        <label class="block text-xs font-bold text-slate-300 mb-1.5">اختر الكورس</label>
                        <select id="video-course-select" onchange="loadVideosForSelectedCourse()"
                            class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-white outline-none"></select>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                        <input id="video-title-input" type="text" placeholder="عنوان الفيديو / المحاضرة *"
                            class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm text-white outline-none">
                        <input id="video-order-input" type="number" min="1" value="1" placeholder="الترتيب"
                            class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm text-white outline-none">
                    </div>

                    <input id="video-source-input" type="text" placeholder="رابط أو ID (YouTube / Vimeo / Google Drive / .mp4 / Embed) *"
                        class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm text-white outline-none">

                    <button onclick="addCourseVideo()"
                        class="w-full py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white font-extrabold text-sm transition">
                        + إضافة فيديو للكورس
                    </button>

                    <div id="videos-list-admin" class="space-y-2 pt-3 border-t border-slate-800 max-h-80 overflow-y-auto"></div>
                </section>

                <!-- إدارة وتوليد الأكواد لكل كورس -->
                <section class="bg-slate-900 border border-slate-800 rounded-3xl p-6 space-y-5">
                    <h2 class="text-lg font-black text-white">أكواد التفعيل (مرتبطة بكورس محدد)</h2>

                    <div>
                        <label class="block text-xs font-bold text-slate-300 mb-1.5">اختر الكورس الذي سيفتح به الكود</label>
                        <select id="code-course-select" onchange="loadCodesForSelectedCourse()"
                            class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-white outline-none"></select>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                        <input id="custom-code-input" type="text" placeholder="كود مخصص (أو اتركه لتوليد تلقائي)"
                            class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm text-white uppercase outline-none">
                        <input id="code-max-uses-input" type="number" min="1" value="1" placeholder="أقصى عدد استخدامات"
                            class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm text-white outline-none">
                    </div>

                    <div class="grid grid-cols-2 gap-3">
                        <button onclick="createSingleCode()"
                            class="py-2.5 rounded-xl bg-blue-600 hover:bg-blue-500 text-white font-extrabold text-xs sm:text-sm transition">
                            + إنشاء كود
                        </button>
                        <button onclick="generateBulkCodes(10)"
                            class="py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-extrabold text-xs sm:text-sm transition">
                            ⚡ توليد 10 أكواد دفعة واحدة
                        </button>
                    </div>

                    <div id="codes-list-admin" class="space-y-2 pt-3 border-t border-slate-800 max-h-80 overflow-y-auto"></div>
                </section>

            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script>
        // غيّر الرمز الإداري ده للرمز اللي يناسبك قبل الرفع
        const ADMIN_PASSCODE = "admin2026";
        let allCourses = [];

        function unlockAdmin() {
            const val = document.getElementById('admin-pass-input').value.trim();
            const err = document.getElementById('login-error');
            if (val !== ADMIN_PASSCODE) {
                err.textContent = "رمز الدخول غير صحيح";
                return;
            }
            sessionStorage.setItem('edtech_admin_authed', '1');
            showDashboard();
        }

        function logoutAdmin() {
            sessionStorage.removeItem('edtech_admin_authed');
            location.reload();
        }

        function showDashboard() {
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('dashboard-screen').classList.remove('hidden');
            refreshAllData();
        }

        function showToast(msg, isError = false) {
            const bar = document.getElementById('toast-bar');
            bar.textContent = msg;
            bar.className = `rounded-2xl px-5 py-3.5 text-sm font-bold border ${
                isError
                    ? 'bg-rose-950/50 border-rose-500/40 text-rose-200'
                    : 'bg-emerald-950/50 border-emerald-500/40 text-emerald-200'
            }`;
            bar.classList.remove('hidden');
            clearTimeout(window._toastTimer);
            window._toastTimer = setTimeout(() => bar.classList.add('hidden'), 3500);
        }

        async function refreshAllData() {
            const { data, error } = await _supabase
                .from('courses')
                .select('id, title, description, playlist_id')
                .order('id', { ascending: true });

            if (error) {
                showToast("خطأ في تحميل الكورسات: " + error.message, true);
                return;
            }

            allCourses = data || [];
            renderCoursesTable();
            populateCourseSelects();
            await loadVideosForSelectedCourse();
            await loadCodesForSelectedCourse();
        }

        function renderCoursesTable() {
            const tbody = document.getElementById('courses-table-body');
            if (allCourses.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" class="py-6 text-center text-slate-500">لا توجد كورسات بعد. أضف أول كورس من الأعلى.</td></tr>`;
                return;
            }

            tbody.innerHTML = allCourses.map(c => `
                <tr class="hover:bg-slate-800/30">
                    <td class="py-3 px-3 font-bold text-slate-400">${c.id}</td>
                    <td class="py-3 px-3 font-extrabold text-white">${escapeHtml(c.title)}</td>
                    <td class="py-3 px-3 text-xs text-slate-400 font-mono">${escapeHtml(c.playlist_id || '—')}</td>
                    <td class="py-3 px-3 flex items-center gap-2">
                        <button onclick="startEditCourse(${c.id})" class="text-xs font-bold bg-amber-500/15 hover:bg-amber-500/25 text-amber-300 px-3 py-1 rounded-lg">
                            تعديل
                        </button>
                        <button onclick="deleteCourse(${c.id})" class="text-xs font-bold bg-rose-500/15 hover:bg-rose-500/25 text-rose-300 px-3 py-1 rounded-lg">
                            حذف
                        </button>
                    </td>
                </tr>
            `).join('');
        }

        function populateCourseSelects() {
            const vSel = document.getElementById('video-course-select');
            const cSel = document.getElementById('code-course-select');
            const prevV = vSel.value;
            const prevC = cSel.value;

            const optionsHtml = allCourses.length
                ? allCourses.map(c => `<option value="${c.id}">#${c.id} — ${escapeHtml(c.title)}</option>`).join('')
                : `<option value="">لا توجد كورسات متاحة</option>`;

            vSel.innerHTML = optionsHtml;
            cSel.innerHTML = optionsHtml;

            if (prevV && allCourses.some(c => String(c.id) === String(prevV))) vSel.value = prevV;
            if (prevC && allCourses.some(c => String(c.id) === String(prevC))) cSel.value = prevC;
        }

        function startEditCourse(courseId) {
            const course = allCourses.find(c => Number(c.id) === Number(courseId));
            if (!course) return;

            document.getElementById('edit-course-id').value = course.id;
            document.getElementById('course-title-input').value = course.title || '';
            document.getElementById('course-playlist-input').value = course.playlist_id || '';
            document.getElementById('course-desc-input').value = course.description || '';
            document.getElementById('course-form-title').textContent = `تعديل الكورس #${course.id}`;
            document.getElementById('cancel-edit-btn').classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function resetCourseForm() {
            document.getElementById('edit-course-id').value = '';
            document.getElementById('course-title-input').value = '';
            document.getElementById('course-playlist-input').value = '';
            document.getElementById('course-desc-input').value = '';
            document.getElementById('course-form-title').textContent = 'إضافة كورس جديد';
            document.getElementById('cancel-edit-btn').classList.add('hidden');
        }

        async function saveCourse() {
            const editId = document.getElementById('edit-course-id').value;
            const title = document.getElementById('course-title-input').value.trim();
            const rawPlaylist = document.getElementById('course-playlist-input').value.trim();
            const description = document.getElementById('course-desc-input').value.trim();

            if (!title) {
                showToast("من فضلك اكتب اسم الكورس أولاً", true);
                return;
            }

            const playlist_id = rawPlaylist ? extractYouTubePlaylistId(rawPlaylist) : null;

            let res;
            if (editId) {
                res = await _supabase
                    .from('courses')
                    .update({ title, description, playlist_id })
                    .eq('id', Number(editId));
            } else {
                res = await _supabase
                    .from('courses')
                    .insert([{ title, description, playlist_id }]);
            }

            if (res.error) {
                showToast("حدث خطأ أثناء حفظ الكورس: " + res.error.message, true);
                return;
            }

            showToast(editId ? "تم تحديث بيانات الكورس بنجاح" : "تمت إضافة الكورس بنجاح");
            resetCourseForm();
            await refreshAllData();
        }

        async function deleteCourse(courseId) {
            if (!confirm("هل أنت متأكد من حذف هذا الكورس وكل الفيديوهات والأكواد المرتبطة به؟")) return;

            const { error } = await _supabase.from('courses').delete().eq('id', Number(courseId));
            if (error) {
                showToast("تعذر حذف الكورس: " + error.message, true);
                return;
            }

            showToast("تم حذف الكورس بنجاح");
            await refreshAllData();
        }

        async function loadVideosForSelectedCourse() {
            const courseId = Number(document.getElementById('video-course-select').value);
            const listEl = document.getElementById('videos-list-admin');
            if (!courseId) {
                listEl.innerHTML = `<p class="text-xs text-slate-500 text-center py-4">اختر كورساً لعرض فيديوهاته.</p>`;
                return;
            }

            const { data, error } = await _supabase
                .from('course_videos')
                .select('id, title, video_id, sort_order')
                .eq('course_id', courseId)
                .order('sort_order', { ascending: true })
                .order('id', { ascending: true });

            if (error) {
                listEl.innerHTML = `<p class="text-xs text-rose-400">خطأ: ${escapeHtml(error.message)}</p>`;
                return;
            }

            if (!data || data.length === 0) {
                listEl.innerHTML = `<p class="text-xs text-slate-500 text-center py-4">لا توجد فيديوهات مضافة لهذا الكورس بعد.</p>`;
                return;
            }

            listEl.innerHTML = data.map(v => `
                <div class="flex items-center justify-between gap-2 bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2.5">
                    <div class="min-w-0">
                        <p class="text-xs font-extrabold text-white truncate">${v.sort_order}. ${escapeHtml(v.title)}</p>
                        <p class="text-[11px] text-slate-400 truncate">${escapeHtml(v.video_id)}</p>
                    </div>
                    <button onclick="deleteVideo(${v.id})" class="shrink-0 text-xs font-bold text-rose-400 hover:text-rose-300 bg-rose-500/10 px-2.5 py-1 rounded-lg">
                        حذف
                    </button>
                </div>
            `).join('');
        }

        async function addCourseVideo() {
            const courseId = Number(document.getElementById('video-course-select').value);
            const title = document.getElementById('video-title-input').value.trim();
            const source = document.getElementById('video-source-input').value.trim();
            const sortOrder = Number(document.getElementById('video-order-input').value) || 1;

            if (!courseId) return showToast("اختر كورساً أولاً", true);
            if (!title || !source) return showToast("أدخل عنوان الفيديو والرابط أو المعرف", true);

            const { error } = await _supabase
                .from('course_videos')
                .insert([{ course_id: courseId, title, video_id: source, sort_order: sortOrder }]);

            if (error) return showToast("خطأ في إضافة الفيديو: " + error.message, true);

            document.getElementById('video-title-input').value = '';
            document.getElementById('video-source-input').value = '';
            showToast("تمت إضافة الفيديو للكورس");
            await loadVideosForSelectedCourse();
        }

        async function deleteVideo(videoId) {
            const { error } = await _supabase.from('course_videos').delete().eq('id', Number(videoId));
            if (error) return showToast("خطأ في حذف الفيديو: " + error.message, true);
            showToast("تم حذف الفيديو");
            await loadVideosForSelectedCourse();
        }

        async function loadCodesForSelectedCourse() {
            const courseId = Number(document.getElementById('code-course-select').value);
            const listEl = document.getElementById('codes-list-admin');
            if (!courseId) {
                listEl.innerHTML = `<p class="text-xs text-slate-500 text-center py-4">اختر كورساً لعرض أكواده.</p>`;
                return;
            }

            const { data, error } = await _supabase
                .from('activation_codes')
                .select('id, code, max_uses, used_count')
                .eq('course_id', courseId)
                .order('id', { ascending: false });

            if (error) {
                listEl.innerHTML = `<p class="text-xs text-rose-400">خطأ: ${escapeHtml(error.message)}</p>`;
                return;
            }

            if (!data || data.length === 0) {
                listEl.innerHTML = `<p class="text-xs text-slate-500 text-center py-4">لا توجد أكواد مضافة لهذا الكورس بعد.</p>`;
                return;
            }

            listEl.innerHTML = data.map(row => `
                <div class="flex items-center justify-between gap-2 bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2.5">
                    <div>
                        <span class="text-xs font-black text-emerald-300 font-mono select-all">${escapeHtml(row.code)}</span>
                        <span class="text-[11px] text-slate-400 mr-2">الاستخدام: ${row.used_count} / ${row.max_uses}</span>
                    </div>
                    <button onclick="deleteCode(${row.id})" class="text-xs font-bold text-rose-400 hover:text-rose-300 bg-rose-500/10 px-2.5 py-1 rounded-lg">
                        حذف
                    </button>
                </div>
            `).join('');
        }

        function randomCodeString(prefix = 'C') {
            const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
            let part = '';
            for (let i = 0; i < 6; i++) {
                part += chars[Math.floor(Math.random() * chars.length)];
            }
            return `${prefix}-${part}`;
        }

        async function createSingleCode() {
            const courseId = Number(document.getElementById('code-course-select').value);
            if (!courseId) return showToast("اختر كورساً أولاً", true);

            const custom = document.getElementById('custom-code-input').value.trim().toUpperCase();
            const maxUses = Number(document.getElementById('code-max-uses-input').value) || 1;
            const code = custom || randomCodeString(`K${courseId}`);

            const { error } = await _supabase
                .from('activation_codes')
                .insert([{ code, course_id: courseId, max_uses: maxUses, used_count: 0 }]);

            if (error) return showToast("تعذر إنشاء الكود (قد يكون مكرراً): " + error.message, true);

            document.getElementById('custom-code-input').value = '';
            showToast(`تم إنشاء الكود: ${code}`);
            await loadCodesForSelectedCourse();
        }

        async function generateBulkCodes(count = 10) {
            const courseId = Number(document.getElementById('code-course-select').value);
            if (!courseId) return showToast("اختر كورساً أولاً", true);

            const maxUses = Number(document.getElementById('code-max-uses-input').value) || 1;
            const rows = Array.from({ length: count }, () => ({
                code: randomCodeString(`K${courseId}`),
                course_id: courseId,
                max_uses: maxUses,
                used_count: 0
            }));

            const { error } = await _supabase.from('activation_codes').insert(rows);
            if (error) return showToast("خطأ أثناء توليد الأكواد: " + error.message, true);

            showToast(`تم توليد ${count} أكواد جديدة للكورس #${courseId}`);
            await loadCodesForSelectedCourse();
        }

        async function deleteCode(codeId) {
            const { error } = await _supabase.from('activation_codes').delete().eq('id', Number(codeId));
            if (error) return showToast("خطأ في حذف الكود: " + error.message, true);
            showToast("تم حذف الكود");
            await loadCodesForSelectedCourse();
        }

        function escapeHtml(str) {
            return String(str || '')
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        if (sessionStorage.getItem('edtech_admin_authed') === '1') {
            showDashboard();
        }
    </script>
</body>
</html>
