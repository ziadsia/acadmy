<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم المدرس</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <nav class="navbar">
        <h1>لوحة تحكم الإدارة ⚙️</h1>
        <a href="courses.html" class="btn btn-outline">عرض المنصة كطالب</a>
    </nav>

    <div class="container" id="admin-content" style="display: none;">
        <div class="grid">
            <div class="card card-body">
                <h3>1. إضافة كورس جديد ➕</h3>
                <input type="text" id="c-title" placeholder="اسم الكورس (مثال: الشهر الأول - تالتة ثانوي)">
                <textarea id="c-desc" placeholder="وصف مختصر للكورس"></textarea>
                <button class="btn btn-primary" onclick="addCourse()">حفظ الكورس</button>
            </div>

            <div class="card card-body">
                <h3>2. توليد أكواد تفعيل 🎟️</h3>
                <select id="code-course-select"></select>
                <input type="number" id="codes-count" value="5" min="1" max="100" placeholder="عدد الأكواد المطلوب">
                <button class="btn btn-success" onclick="generateCodes()">توليد الأكواد الآن</button>
                <textarea id="generated-result" rows="4" placeholder="الأكواد الجديدة ستظهر هنا للنسخ..." readonly style="margin-top: 10px;"></textarea>
            </div>

            <div class="card card-body">
                <h3>3. إضافة محاضرة لكورس 🎬</h3>
                <select id="lesson-course-select"></select>
                <input type="text" id="l-title" placeholder="عنوان المحاضرة">
                <input type="text" id="l-yt" placeholder="ID فيديو اليوتيوب فقط (مثال: dQw4w9WgXcQ)">
                <input type="text" id="l-pdf" placeholder="رابط المذكرة PDF (اختياري)">
                <input type="text" id="l-exam" placeholder="رابط الامتحان (اختياري)">
                <button class="btn btn-primary" onclick="addLesson()">إضافة المحاضرة</button>
            </div>
        </div>
    </div>

    <script src="config.js"></script>
    <script>
        const ADMIN_PASS = "123456"; 
        const pass = prompt("أدخل كلمة مرور لوحة التحكم:");
        if (pass === ADMIN_PASS) {
            document.getElementById('admin-content').style.display = 'block';
            loadAdminCourses();
        } else {
            alert("كلمة مرور خاطئة!");
            window.location.href = "index.html";
        }

        async function loadAdminCourses() {
            const { data: courses } = await _supabase.from('courses').select('*').order('id');
            const selects = [document.getElementById('code-course-select'), document.getElementById('lesson-course-select')];
            selects.forEach(sel => {
                sel.innerHTML = '';
                if(courses) courses.forEach(c => sel.innerHTML += `<option value="${c.id}">${c.title}</option>`);
            });
        }

        async function addCourse() {
            const title = document.getElementById('c-title').value.trim();
            const description = document.getElementById('c-desc').value.trim();
            if (!title) return alert("اكتب اسم الكورس!");

            const { error } = await _supabase.from('courses').insert([{ title, description }]);
            if (error) return alert("خطأ: " + error.message);

            alert("تم إضافة الكورس بنجاح!");
            document.getElementById('c-title').value = '';
            document.getElementById('c-desc').value = '';
            loadAdminCourses();
        }

        async function generateCodes() {
            const courseId = document.getElementById('code-course-select').value;
            const count = parseInt(document.getElementById('codes-count').value);
            if (!courseId || !count) return;

            let newCodes = [];
            let textList = [];

            for (let i = 0; i < count; i++) {
                const randomCode = 'EDU-' + Math.random().toString(36).substring(2, 8).toUpperCase();
                newCodes.push({ code: randomCode, course_id: courseId });
                textList.push(randomCode);
            }

            const { error } = await _supabase.from('activation_codes').insert(newCodes);
            if (!error) {
                document.getElementById('generated-result').value = textList.join('\n');
                alert(`تم توليد ${count} كود بنجاح!`);
            } else {
                alert("خطأ: " + error.message);
            }
        }

        async function addLesson() {
            const course_id = document.getElementById('lesson-course-select').value;
            const title = document.getElementById('l-title').value.trim();
            const youtube_id = document.getElementById('l-yt').value.trim();
            const pdf_url = document.getElementById('l-pdf').value.trim();
            const exam_url = document.getElementById('l-exam').value.trim();

            if (!title || !youtube_id) return alert("عنوان المحاضرة و ID الفيديو مطلوبين!");

            const { error } = await _supabase.from('lessons').insert([{ course_id, title, youtube_id, pdf_url, exam_url }]);
            if (error) return alert("خطأ: " + error.message);

            alert("تم إضافة المحاضرة للكورس بنجاح!");
            document.getElementById('l-title').value = '';
            document.getElementById('l-yt').value = '';
        }
    </script>
</body>
</html>
