<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول | منصة التفوق التعليمية</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Cairo', sans-serif; }
    </style>
</head>
<body class="min-h-screen bg-slate-950 text-white flex items-center justify-center p-4 relative overflow-hidden">

    <!-- إضاءات خلفية عصرية -->
    <div class="absolute -top-24 -right-24 w-96 h-96 bg-blue-600/20 rounded-full blur-3xl pointer-events-none"></div>
    <div class="absolute -bottom-24 -left-24 w-96 h-96 bg-indigo-600/20 rounded-full blur-3xl pointer-events-none"></div>

    <div class="relative z-10 w-full max-w-md bg-slate-900/70 backdrop-blur-xl border border-slate-800 rounded-3xl p-8 shadow-2xl">
        <!-- اللوجو -->
        <div class="w-16 h-16 mx-auto mb-4 bg-gradient-to-tr from-blue-600 to-indigo-500 rounded-2xl flex items-center justify-center text-3xl shadow-lg shadow-blue-500/30">
            🎓
        </div>
        <h2 class="text-2xl font-black text-center text-white mb-1">أهلاً بك في منصتك</h2>
        <p class="text-slate-400 text-sm text-center mb-7">سجل برقم موبايلك وابدأ رحلة التفوق</p>

        <!-- أزرار التبديل (دخول / حساب جديد) -->
        <div class="grid grid-cols-2 bg-slate-950/80 p-1.5 rounded-2xl border border-slate-800/80 mb-6">
            <button id="tab-login" onclick="switchTab('login')" class="py-2.5 rounded-xl font-bold text-sm bg-blue-600 text-white shadow-md transition-all">
                تسجيل الدخول
            </button>
            <button id="tab-signup" onclick="switchTab('signup')" class="py-2.5 rounded-xl font-bold text-sm text-slate-400 hover:text-white transition-all">
                حساب جديد
            </button>
        </div>

        <!-- حقول الإدخال -->
        <div class="space-y-4">
            <div class="relative">
                <span class="absolute right-4 top-3.5 text-lg opacity-70">📱</span>
                <input type="tel" id="phone" placeholder="رقم الموبايل (مثال: 01012345678)" dir="ltr" 
                    class="w-full bg-slate-950/60 border border-slate-800 focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20 rounded-2xl py-3.5 pr-12 pl-4 text-right text-white placeholder-slate-500 outline-none transition-all">
            </div>

            <div class="relative">
                <span class="absolute right-4 top-3.5 text-lg opacity-70">🔒</span>
                <input type="password" id="password" placeholder="كلمة المرور" 
                    class="w-full bg-slate-950/60 border border-slate-800 focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20 rounded-2xl py-3.5 pr-12 pl-4 text-white placeholder-slate-500 outline-none transition-all">
            </div>

            <button id="submit-btn" onclick="handleAuth()" 
                class="w-full py-3.5 mt-2 rounded-2xl bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-extrabold text-base shadow-lg shadow-blue-600/30 transition-all transform active:scale-95">
                دخول للمنصة 🚀
            </button>
        </div>

        <p id="msg" class="text-center text-sm font-bold mt-4 min-h-[20px]"></p>
    </div>

    <script src="config.js"></script>
    <script>
        let mode = 'login';

        _supabase.auth.getSession().then(({ data: { session } }) => {
            if (session) window.location.href = 'courses.html';
        });

        function switchTab(newMode) {
            mode = newMode;
            const loginBtn = document.getElementById('tab-login');
            const signupBtn = document.getElementById('tab-signup');
            const submitBtn = document.getElementById('submit-btn');

            if (mode === 'login') {
                loginBtn.className = "py-2.5 rounded-xl font-bold text-sm bg-blue-600 text-white shadow-md transition-all";
                signupBtn.className = "py-2.5 rounded-xl font-bold text-sm text-slate-400 hover:text-white transition-all";
                submitBtn.innerHTML = 'دخول للمنصة 🚀';
            } else {
                signupBtn.className = "py-2.5 rounded-xl font-bold text-sm bg-blue-600 text-white shadow-md transition-all";
                loginBtn.className = "py-2.5 rounded-xl font-bold text-sm text-slate-400 hover:text-white transition-all";
                submitBtn.innerHTML = 'إنشاء حساب جديد ✨';
            }
            document.getElementById('msg').innerText = '';
        }

        async function handleAuth() {
            const phone = document.getElementById('phone').value.trim();
            const password = document.getElementById('password').value.trim();
            const msg = document.getElementById('msg');
            const btn = document.getElementById('submit-btn');

            if (!phone || !password) {
                msg.className = "text-center text-sm font-bold mt-4 text-rose-400";
                return msg.innerText = "من فضلك اكتب رقم الموبايل وكلمة المرور";
            }

            const fakeEmail = `student_${phone.replace(/\s+/g, '')}@platform.local`;
            btn.disabled = true;
            btn.innerHTML = 'جاري التحقق... ⏳';
            msg.innerText = "";

            if (mode === 'login') {
                const { error } = await _supabase.auth.signInWithPassword({ email: fakeEmail, password });
                btn.disabled = false;
                btn.innerHTML = 'دخول للمنصة 🚀';

                if (error) {
                    msg.className = "text-center text-sm font-bold mt-4 text-rose-400";
                    msg.innerText = "❌ رقم الموبايل أو كلمة المرور غير صحيحة!";
                } else {
                    window.location.href = 'courses.html';
                }
            } else {
                let { error } = await _supabase.auth.signUp({ email: fakeEmail, password });
                
                if (error && (error.message.includes('rate limit') || error.message.includes('Over Request Limit'))) {
                    const uniqueEmail = `student_${phone.replace(/\s+/g, '')}_${Math.floor(Math.random() * 1000)}@platform.local`;
                    const retry = await _supabase.auth.signUp({ email: uniqueEmail, password });
                    error = retry.error;
                }

                btn.disabled = false;
                btn.innerHTML = 'إنشاء حساب جديد ✨';

                if (error) {
                    msg.className = "text-center text-sm font-bold mt-4 text-rose-400";
                    msg.innerText = error.message.includes('already registered') ? "⚠️ الرقم ده مسجل قبل كده، ادخل من تسجيل الدخول!" : "خطأ: " + error.message;
                } else {
                    msg.className = "text-center text-sm font-bold mt-4 text-emerald-400";
                    msg.innerText = "🎉 تم إنشاء حسابك بنجاح! جاري تحويلك...";
                    setTimeout(() => window.location.href = 'courses.html', 900);
                }
            }
        }

        document.addEventListener('keypress', e => { if (e.key === 'Enter') handleAuth(); });
    </script>
</body>
</html>
