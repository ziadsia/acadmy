<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول بالرقم | المنصة التعليمية</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="auth-wrapper">
        <div class="auth-box">
            <h2 style="color: var(--primary); margin-top: 0;">أهلاً بك يا بطل 🎓</h2>
            <p style="color: var(--muted); font-size: 0.9rem;">سجل دخولك برقم الموبايل وكلمة المرور</p>
            
            <div class="tabs">
                <div class="tab active" id="tab-login" onclick="switchTab('login')">تسجيل الدخول</div>
                <div class="tab" id="tab-signup" onclick="switchTab('signup')">حساب جديد</div>
            </div>

            <div id="form-area">
                <input type="tel" id="phone" placeholder="رقم الموبايل (مثال: 01012345678)" dir="ltr" style="text-align: right;">
                <input type="password" id="password" placeholder="كلمة المرور (أرقام أو حروف)">
                <button class="btn btn-primary" style="width: 100%;" id="submit-btn" onclick="handleAuth()">دخول للمنصة</button>
            </div>
            <p id="msg" style="color: #ef4444; font-size: 0.9rem; margin-top: 15px;"></p>
        </div>
    </div>

    <script src="config.js"></script>
    <script>
        let mode = 'login';

        // لو الطالب مسجل دخول قبل كده، نحوله مباشرة للكورسات
        _supabase.auth.getSession().then(({ data: { session } }) => {
            if (session) window.location.href = 'courses.html';
        });

        function switchTab(newMode) {
            mode = newMode;
            document.getElementById('tab-login').classList.toggle('active', mode === 'login');
            document.getElementById('tab-signup').classList.toggle('active', mode === 'signup');
            document.getElementById('submit-btn').innerText = mode === 'login' ? 'دخول للمنصة' : 'إنشاء حساب جديد';
            document.getElementById('msg').innerText = '';
        }

        async function handleAuth() {
            const phone = document.getElementById('phone').value.trim();
            const password = document.getElementById('password').value.trim();
            const msg = document.getElementById('msg');

            if (!phone || !password) return msg.innerText = "من فضلك اكتب رقم الموبايل وكلمة المرور";
            
            // تحويل رقم الموبايل لوهمي رسمي يفهمه Supabase خلف الكواليس
            const fakeEmail = `student_${phone}@platform.local`;

            msg.style.color = "#2563eb";
            msg.innerText = "جاري التحميل...";

            if (mode === 'login') {
                const { error } = await _supabase.auth.signInWithPassword({ email: fakeEmail, password });
                if (error) {
                    msg.style.color = "#ef4444";
                    msg.innerText = "رقم الموبايل أو كلمة المرور غير صحيحة!";
                } else {
                    window.location.href = 'courses.html';
                }
            } else {
                const { error } = await _supabase.auth.signUp({ email: fakeEmail, password });
                if (error) {
                    msg.style.color = "#ef4444";
                    if (error.message.includes('already registered')) {
                        msg.innerText = "رقم الموبايل مسجل من قبل، جرب تسجيل الدخول!";
                    } else {
                        msg.innerText = "حدث خطأ: " + error.message;
                    }
                } else {
                    style.color = "#10b981";
                    msg.innerText = "تم إنشاء الحساب بنجاح! جاري تحويلك...";
                    setTimeout(() => window.location.href = 'courses.html', 1000);
                }
            }
        }
    </script>
</body>
</html>
